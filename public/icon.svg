<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Dynamic Animated Chart Graphic -->
  <g transform="translate(64, 76)">
    <!-- Zero / baseline axis line -->
    <line x1="24" y1="20" x2="24" y2="340" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>

    <!-- Bar 1 -->
    <rect x="24" y="44" width="310" height="48" rx="24" fill="url(#bar1)" filter="url(#glow)"/>
    <circle cx="334" cy="68" r="8" fill="#ffffff" opacity="0.9"/>

    <!-- Bar 2 -->
    <rect x="24" y="132" width="220" height="48" rx="24" fill="url(#bar2)"/>
    <circle cx="244" cy="156" r="8" fill="#ffffff" opacity="0.9"/>

    <!-- Bar 3 -->
    <rect x="24" y="220" width="340" height="48" rx="24" fill="url(#bar3)" filter="url(#glow)"/>
    <circle cx="364" cy="244" r="8" fill="#ffffff" opacity="0.9"/>

    <!-- Dynamic Sparkle Indicator -->
    <circle cx="364" cy="244" r="18" fill="#ffffff" opacity="0.25"/>

    <!-- Mode Accent Dot / Play Arrow -->
    <polygon points="34,310 54,324 34,338" fill="#38bdf8"/>
    <circle cx="84" cy="324" r="10" fill="#a855f7"/>
    <circle cx="124" cy="324" r="14" fill="#ec4899"/>
  </g>
</svg>
